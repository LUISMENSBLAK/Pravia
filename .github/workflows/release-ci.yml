name: Release CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=pravia_os
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=pravia_os
      - run: npx prisma generate
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  empty-database-bootstrap:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:init-empty
        env:
          INIT_CONFIRMATION: INITIALIZE_EMPTY_PRAVIA_TARGET
          INIT_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=pravia_os
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=pravia_os
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=pravia_os
      - run: npm run db:migrate:status
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=pravia_os
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=pravia_os

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run check:secrets
        working-directory: backend
